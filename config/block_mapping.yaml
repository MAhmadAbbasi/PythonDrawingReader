# Which electrical point a drawing symbol is.
# Each pattern is a regular expression matched against the block name (DXF), the layer name, or the legend
# description, after normalising: upper case, symbols turned into spaces, and a space between letters and
# digits ("SKT15A" -> "SKT 15 A"). The FIRST type that matches wins, so put the specific ones first
# (exhaust fan before fan, 15A socket before 5A socket).
#
# Architects name blocks differently - add your own block names under `blocks` (exact name -> type);
# they win over the patterns.

blocks:
  # "E-LT-01": light
  # "FAN_CEIL": fan

types:
  exhaust_fan: ['EXHAUST', '\bEXH\b', '\bE\s?FAN\b', 'VENT\w* FAN']
  fan: ['\bFAN\b', 'CEILING FAN', '\bCF\b']
  light: ['LIGHT', '\bLAMP\b', 'DOWN ?LIGHT', '\bSPOT\b', '\bLED\b', '\bBULB\b', '\bTUBE\b', 'CHANDELIER', '\bLT\b', '\bLUM']
  ac_point: ['\bA ?C\b', 'AIR ?COND', '\bSPLIT\b', '\bHVAC\b']
  geyser: ['GEYSER', 'WATER HEATER', '\bWH\b']
  socket_15A: ['\b(15|16|20) ?A(MP)?\b', 'POWER (SOCKET|POINT|OUTLET)']
  socket_5A: ['\b(5|6|10|13) ?A(MP)?\b', 'SOCKET', 'OUTLET', 'RECEPTACLE', '\bSKT\b', '\bS ?O\b']
  switch: ['SWITCH', '\bSW\b', '\bSWB\b', 'GANG']
  tv_point: ['\bTV\b', '\bT ?V POINT\b', 'TELEVISION', '\bCATV\b']
  data_point: ['\bDATA\b', '\bLAN\b', '\bRJ ?45\b', 'INTERNET', '\bNETWORK\b', '\bTEL\b', 'TELEPHONE']
  db_panel: ['\bD ?B\b', 'DISTRIBUTION', '\bPANEL\b', '\bMCB\b', '\bMDB\b', '\bSDB\b']
  bell: ['\bBELL\b', 'CHIME']
  cctv: ['CCTV', 'CAMERA']
  intercom: ['INTERCOM', 'VIDEO DOOR', 'DOOR PHONE']
  curtain: ['CURTAIN', '\bBLIND\b', '\bSHADE\b']
  smoke_detector: ['SMOKE', 'FIRE ALARM', 'DETECTOR']
  main_door: ['MAIN DOOR', 'MAIN ENTRANCE', 'ENTRY DOOR']

# Point types that are not electrical fittings and are ignored when counting
ignore: ['DOOR', 'WINDOW', 'FURNITURE', 'BED', 'SOFA', 'TABLE', 'CHAIR', 'TREE', 'PLANT', 'CAR', 'WC', 'BASIN', 'SINK', 'NORTH', 'ARROW']
